type User @table {
  email: String!
  displayName: String!
  avatarUrl: String
}

type Project @table {
  name: String!
  description: String
  deadline: Timestamp
  owner: User!
}

type Task @table {
  title: String!
  status: String!
  description: String
  dueDate: Timestamp
  project: Project!
  assignee: User
}

type Comment @table {
  content: String!
  createdAt: Timestamp
  task: Task!
  author: User!
}

type TeamMember @table(key: ["user", "project"]) {
  role: String!
  user: User!
  project: Project!
}